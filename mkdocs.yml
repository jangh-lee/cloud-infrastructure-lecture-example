site_name: 클라우드 인프라 실습
site_description: Naver Cloud 기반 클라우드 인프라 실습 교안
site_url: https://jangh-lee.github.io/cloud-infrastructure-lecture-example/
repo_url: https://github.com/jangh-lee/cloud-infrastructure-lecture-example
repo_name: jangh-lee/cloud-infrastructure-lecture-example
edit_uri: edit/main/gitbook/
docs_dir: gitbook

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - redirects:
      redirect_maps:
        labs/007-acg-slack-alert.md: labs/101-acg-slack-alert.md
        labs/008-cloud-cli.md: labs/501-cloud-cli.md
        labs/009-terraform.md: labs/502-terraform.md
        labs/010-cost-slack-alert.md: labs/503-cost-slack-alert.md
        labs/011-static-website.md: labs/201-static-website.md
        labs/012-load-balancer.md: labs/301-load-balancer.md
        labs/013-auto-scaling.md: labs/302-auto-scaling.md
        labs/014-auto-scaling.md: labs/303-auto-scaling.md
        labs/015-cloud-db-mysql.md: labs/401-cloud-db-mysql.md
        labs/016-database-backup-recovery.md: labs/402-database-backup-recovery.md
        labs/017-cloud-db-migration.md: labs/403-cloud-db-migration.md

nav:
  - 강의 소개: README.md
  - 운영 준비:
      - GitHub Pages 배포: setup/github-pages.md
      - GitBook 운영 준비: setup/gitbook.md
  - Labs:
      - 서버 실습:
          - 001 API Server: labs/001-api-server.md
          - 002 Init Script: labs/002-init-script.md
          - 003 Three Tier Web App: labs/003-three-tier-web-app.md
          - 004 Game Server 생성 실습: labs/004-game-server.md
          - 005 AI RAG Studio: labs/005-ai-rag-studio.md
          - 006 Linux Commands: labs/006-linux-commands.md
          - 007 FTP/FTPS 파일 서버: labs/007-file-server.md
      - 네트워크 실습:
          - 101 ACG Slack Alert: labs/101-acg-slack-alert.md
      - 스토리지 실습:
          - 201 Object Storage 정적 웹사이트: labs/201-static-website.md
      - Load Balancer 및 Auto Scaling 실습:
          - 301 Load Balancer: labs/301-load-balancer.md
          - 302 Auto Scaling Hands-on (1): labs/302-auto-scaling.md
          - 303 Auto Scaling Hands-on (2): labs/303-auto-scaling.md
      - 데이터베이스 실습:
          - 401 Cloud DB for MySQL 생성 및 연결: labs/401-cloud-db-mysql.md
          - 402 Database 백업 및 복구: labs/402-database-backup-recovery.md
          - 403 Cloud DB Migration: labs/403-cloud-db-migration.md
      - CLI 및 IaC 실습:
          - 501 Cloud CLI: labs/501-cloud-cli.md
          - 502 Terraform: labs/502-terraform.md
          - 503 Cost Slack Alert: labs/503-cost-slack-alert.md
  - GitBook 목차: SUMMARY.md
