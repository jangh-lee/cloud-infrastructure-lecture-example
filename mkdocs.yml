site_name: 클라우드 인프라 실습
site_description: Naver Cloud 기반 클라우드 인프라 실습 교안
site_url: https://jangh-lee.github.io/cloud-infrastructure-lecture-example/
repo_url: https://github.com/jangh-lee/cloud-infrastructure-lecture-example
repo_name: jangh-lee/cloud-infrastructure-lecture-example
docs_dir: gitbook

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.select
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - 강의 소개: README.md
  - 운영 준비:
      - GitHub Pages 배포: setup/github-pages.md
      - GitBook 운영 준비: setup/gitbook.md
  - Labs:
      - 001 API Server: labs/001-api-server.md
      - 002 Init Script: labs/002-init-script.md
      - 003 Cloud CLI: labs/003-cloud-cli.md
      - 004 Load Balancer: labs/004-load-balancer.md
      - 005 Object Storage 정적 웹사이트: labs/005-static-website.md
      - 006 Database 백업 및 복구: labs/006-database-backup-recovery.md
      - 007 Three Tier Web App: labs/007-three-tier-web-app.md
      - 008 Game Server 생성 실습: labs/008-game-server.md
      - 009 AI RAG Studio: labs/009-ai-rag-studio.md
      - 010 Linux Commands: labs/010-linux-commands.md
      - 011 Terraform: labs/011-terraform.md
      - 012 Cloud DB Migration: labs/012-cloud-db-migration.md
      - 013 Cost Slack Alert: labs/013-cost-slack-alert.md
      - 014 ACG Slack Alert: labs/014-acg-slack-alert.md
      - 015 Auto Scaling Hands-on: labs/015-auto-scaling.md
  - GitBook 목차: SUMMARY.md
