<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="게시글을 작성하고 의견을 나누는 커뮤니티 게시판">
  <title>게시판</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" data-route="/">
        <strong id="siteTitle">DevForum</strong>
        <span>게시판</span>
      </a>
      <nav class="account-actions" aria-label="계정">
        <span id="accountName" class="account-name" hidden></span>
        <button id="memberLoginButton" class="text-button" type="button">로그인</button>
        <button id="logoutButton" class="text-button" type="button" hidden>로그아웃</button>
        <button id="adminLoginButton" class="button button-secondary" type="button">관리자 로그인</button>
      </nav>
    </div>
  </header>

  <main class="shell main-content">
    <section id="serviceView" class="service-view" aria-labelledby="serviceTitle" hidden>
      <span id="serviceLabel" class="notice-label">서비스 안내</span>
      <h1 id="serviceTitle"></h1>
      <p id="serviceMessage"></p>
      <button id="serviceRetry" class="button button-secondary" type="button">다시 확인</button>
      <p class="service-hint">서비스 상태를 주기적으로 확인하고 있습니다.</p>
    </section>

    <section id="listView" class="view" aria-labelledby="listHeading">
      <div class="page-heading">
        <div>
          <h1 id="listHeading">게시글</h1>
          <p>전체 <strong id="postCount">0</strong>개</p>
        </div>
        <button class="button button-primary" type="button" data-route="/write">글쓰기</button>
      </div>

      <div class="board-tools">
        <form id="searchForm" class="search-form" role="search">
          <label class="sr-only" for="searchInput">게시글 검색</label>
          <input id="searchInput" type="search" placeholder="제목 또는 작성자 검색" autocomplete="off">
          <button class="button button-secondary" type="submit">검색</button>
        </form>
        <button id="refreshButton" class="text-button" type="button">새로고침</button>
      </div>

      <p id="listStatus" class="inline-status" role="status" aria-live="polite"></p>

      <div class="board-table">
        <div class="board-row board-header" aria-hidden="true">
          <span>번호</span>
          <span>제목</span>
          <span>작성자</span>
          <span>등록일시</span>
        </div>
        <button id="noticeRow" class="board-row post-row notice-row" type="button" data-route="/notice" hidden>
          <span class="notice-badge">공지</span>
          <span class="post-title">
            <strong id="noticeTitle"></strong>
            <small id="noticeMeta"></small>
          </span>
          <span class="post-author">관리자</span>
          <time id="noticeDate" class="post-date"></time>
        </button>
        <div id="postList" class="post-list"></div>
        <div id="emptyState" class="empty-state" hidden>
          <strong>게시글이 없습니다.</strong>
          <span>첫 번째 글을 작성해 보세요.</span>
        </div>
      </div>

      <nav id="pagination" class="pagination" aria-label="게시글 페이지"></nav>
    </section>

    <section id="detailView" class="view detail-view" aria-labelledby="detailTitle" hidden>
      <button class="back-button" type="button" data-route="/">목록으로</button>
      <article class="post-detail">
        <header class="detail-header">
          <span id="detailNoticeLabel" class="notice-badge detail-notice-label" hidden>공지</span>
          <h1 id="detailTitle"></h1>
          <div class="detail-meta">
            <span id="detailAuthor"></span>
            <time id="detailDate"></time>
          </div>
        </header>
        <div id="detailContent" class="detail-content"></div>
        <footer class="detail-actions">
          <button class="button button-secondary" type="button" data-route="/">목록</button>
          <button id="deleteButton" class="button button-danger" type="button">삭제</button>
        </footer>
      </article>
    </section>

    <section id="writeView" class="view write-view" aria-labelledby="writeHeading" hidden>
      <button class="back-button" type="button" data-route="/">목록으로</button>
      <div class="write-heading">
        <h1 id="writeHeading">글쓰기</h1>
        <span>작성자: 비가입 유저</span>
      </div>
      <form id="postForm" class="post-form">
        <label for="titleInput">제목</label>
        <div class="field-wrap">
          <input id="titleInput" type="text" maxlength="120" placeholder="제목을 입력하세요" required>
          <span id="titleCount" class="character-count">0 / 120</span>
        </div>

        <label for="contentInput">내용</label>
        <div class="field-wrap">
          <textarea id="contentInput" maxlength="2000" placeholder="내용을 입력하세요" required></textarea>
          <span id="contentCount" class="character-count">0 / 2000</span>
        </div>

        <p id="formStatus" class="inline-status" role="alert" aria-live="assertive"></p>
        <div class="form-actions">
          <button class="button button-secondary" type="button" data-route="/">취소</button>
          <button id="submitButton" class="button button-primary" type="submit">등록</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>누구나 글을 나누는 게시판</span>
      <div class="footer-statuses">
        <span id="webInstanceInfo" class="web-instance-info" title="현재 요청을 처리한 Web 서버">Web 확인 중</span>
        <span id="healthStatus" class="connection-status status-pending">서버 확인 중</span>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="authDialog" class="account-dialog" aria-labelledby="authHeading">
    <div class="dialog-heading">
      <h2 id="authHeading">로그인</h2>
      <button class="text-button" type="button" data-close-dialog="authDialog" aria-label="로그인 창 닫기">닫기</button>
    </div>
    <p id="authDescription" class="dialog-description">회원 계정으로 로그인해 주세요.</p>
    <form id="authForm" class="account-form">
      <label for="usernameInput">아이디</label>
      <input id="usernameInput" name="username" autocomplete="username" pattern="[a-z0-9_]{3,32}" minlength="3" maxlength="32" placeholder="영문 소문자, 숫자, 밑줄 3~32자" required>
      <div id="displayNameField" class="account-form" hidden>
        <label for="displayNameInput">이름</label>
        <input id="displayNameInput" name="displayName" autocomplete="nickname" maxlength="50" placeholder="게시판에서 사용할 이름">
      </div>
      <label for="passwordInput">비밀번호</label>
      <input id="passwordInput" type="password" name="password" autocomplete="current-password" maxlength="128" required>
      <p id="authStatus" class="inline-status" role="alert"></p>
      <button id="authSubmit" class="button button-primary" type="submit">로그인</button>
    </form>
    <button id="authSwitch" class="text-button auth-switch" type="button">계정이 없으신가요? 회원 가입</button>
  </dialog>

  <dialog id="adminDialog" class="account-dialog admin-dialog" aria-labelledby="adminHeading">
    <div class="dialog-heading">
      <div><span class="notice-label">관리자</span><h2 id="adminHeading">공지 관리</h2></div>
      <button class="text-button" type="button" data-close-dialog="adminDialog" aria-label="공지 관리 창 닫기">닫기</button>
    </div>
    <p class="dialog-description">사전 안내부터 점검 종료까지, 게시판에 표시할 공지를 관리하세요.</p>
    <form id="noticeForm" class="account-form">
      <label for="noticeModeInput">표시 방식</label>
      <select id="noticeModeInput">
        <option value="announce">사전 공지 · 게시글 최상단 고정</option>
        <option value="maintenance">점검 시작 · 게시판 이용 중단</option>
        <option value="normal">공지 종료 / 점검 해제</option>
      </select>
      <p id="noticeModeHint" class="field-hint"></p>
      <div id="noticeTextFields" class="account-form">
        <label for="noticeTitleInput">공지 제목</label>
        <input id="noticeTitleInput" maxlength="200" placeholder="예: 데이터베이스 이전 작업 안내" required>
        <label for="noticeBodyInput">공지 내용</label>
        <textarea id="noticeBodyInput" rows="6" maxlength="10000" placeholder="작업 시간과 이용 제한 내용을 입력하세요." required></textarea>
      </div>
      <p id="adminStatus" class="inline-status" role="status" aria-live="polite"></p>
      <button id="noticeSubmit" class="button button-primary" type="submit">공지 반영</button>
    </form>
    <section class="notice-history" aria-labelledby="historyHeading">
      <h3 id="historyHeading">최근 공지 이력</h3>
      <ul id="noticeHistory"></ul>
    </section>
  </dialog>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
